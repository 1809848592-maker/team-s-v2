name: teams-platform-dev

x-backend: &backend
  image: teams-platform:dev
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-teams}:${POSTGRES_PASSWORD:-teams_local_dev}@postgres:5432/${POSTGRES_DB:-teams_dev}
    STATIC_DIR: /app/static
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1209600}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    PLATFORM_ADMIN_USER_IDS: ${PLATFORM_ADMIN_USER_IDS:-}
    STORAGE_DIR: /app/storage
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-104857600}
    MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*}
    MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*,http://[::1]:*}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    REVIEW_JOB_TIMEOUT_SECONDS: ${REVIEW_JOB_TIMEOUT_SECONDS:-300}
    REVIEW_JOB_LEASE_GRACE_SECONDS: ${REVIEW_JOB_LEASE_GRACE_SECONDS:-5}
    REVIEW_JOB_MAX_ATTEMPTS: ${REVIEW_JOB_MAX_ATTEMPTS:-3}
    REVIEW_JOB_RETRY_DELAY_SECONDS: ${REVIEW_JOB_RETRY_DELAY_SECONDS:-5}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    LLM_ENABLE_LIVE_CALLS: ${LLM_ENABLE_LIVE_CALLS:-false}
    LLM_PROJECT_DAILY_REVIEWS: ${LLM_PROJECT_DAILY_REVIEWS:-20}
    LLM_PLATFORM_DAILY_REVIEWS: ${LLM_PLATFORM_DAILY_REVIEWS:-200}
    LLM_PLATFORM_DAILY_TOKENS: ${LLM_PLATFORM_DAILY_TOKENS:-1000000}
    LLM_MAX_CALLS_PER_REVIEW: ${LLM_MAX_CALLS_PER_REVIEW:-64}
  volumes:
    - files_dev_data:/app/storage
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teams_dev}
      POSTGRES_USER: ${POSTGRES_USER:-teams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teams_local_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_dev_data:
  files_dev_data:
