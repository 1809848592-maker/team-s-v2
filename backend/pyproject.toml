[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-platform"
version = "0.1.0"
description = "Team.s v2 协同工作台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
  "python-multipart>=0.0.20,<1",
  "mcp>=2.3,<3",
  "httpx2>=2.16,<3",
  "pypdf>=7.0.1,<8",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.review" = ["models.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
# 固定输入样例须保留BOM、CRLF及源代码标记，不能被代码格式化器改写。
exclude = ["tests/fixtures/**"]
